spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      properties:
        schema.registry.url: http://localhost:8081
    producer:
      properties:
        schema.registry.url: http://localhost:8081

fraud-detector:
  topics:
    completed: calls.completed.test
    fraud-alerts: calls.fraud-alerts.test
  windows:
    frequent-calls:
      size-ms: 60000
      advance-ms: 10000
      threshold: 5
    nps-escalation:
      window-hours: 24
      threshold: 3
  filters:
    min-duration-seconds: 5
    max-duration-seconds: 300
