server:
  port: 8082

spring:
  application:
    name: fraud-detector

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader.use-old-record: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
      acks: all
      enable-idempotence: true

  streams:
    application-id: fraud-detector
    properties:
      # Exactly-once semantics
      processing.guarantee: exactly_once_v2
      # State directory for RocksDB
      state.dir: /tmp/kafka-streams/fraud-detector
      # RocksDB compression
      rocksdb.state.dir: /tmp/kafka-streams/fraud-detector
      # Cache configuration
      cache.max.bytes.buffering: 10485760
      # Cleanup interval
      cleanup.interval.ms: 60000
      # Replication factor
      replication.factor: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

fraud-detector:
  topics:
    completed: calls.completed
    fraud-alerts: calls.fraud-alerts
  windows:
    frequent-calls:
      size-ms: 60000
      advance-ms: 10000
      threshold: 5
    nps-escalation:
      window-hours: 24
      threshold: 3
  filters:
    min-duration-seconds: 5
    max-duration-seconds: 300

logging:
  level:
    com.example.frauddetector: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
