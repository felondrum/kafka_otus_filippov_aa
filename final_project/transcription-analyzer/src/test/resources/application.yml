spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:tc:postgresql://localhost/test_db
    username: test_user
    password: test_password
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

transcription:
  keywords: [card, loan, fraud, complaint, transfer, block, limit, payment, balance]
  words-per-minute: 150
  text-templates:
    - "I am calling regarding {topic}"
    - "Could you please provide more details about {topic}"
