# JMX Exporter configuration for Prometheus
# Extracts Kafka metrics in Prometheus-compatible format
# Expanded to cover broker topic metrics, network, request latency, consumer groups, and partition leadership

lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  # ==========================================
  # Request Handler Pool Metrics
  # ==========================================
  - pattern: 'kafka.server<type=\"KafkaRequestHandlerPool\", name=\"RequestHandlerAvgIdlePercent\"><>Value'
    name: kafka_server_kafkarequesthandlerpool_request_handler_avg_idle_percent
    type: GAUGE

  # ==========================================
  # Broker Topic Metrics (messages in/out, bytes in/out)
  # ==========================================
  - pattern: 'kafka.server<type=\"broker-topic-metrics\", name=\"MessagesInPerSec\", topic=\"(.*)\"><>OneMinuteRate'
    name: kafka_server_broker_topic_metrics_messages_in_per_sec
    labels:
      topic: "$1"
    type: GAUGE

  - pattern: 'kafka.server<type=\"broker-topic-metrics\", name=\"BytesInPerSec\", topic=\"(.*)\"><>OneMinuteRate'
    name: kafka_server_broker_topic_metrics_bytes_in_per_sec
    labels:
      topic: "$1"
    type: GAUGE

  - pattern: 'kafka.server<type=\"broker-topic-metrics\", name=\"BytesOutPerSec\", topic=\"(.*)\"><>OneMinuteRate'
    name: kafka_server_broker_topic_metrics_bytes_out_per_sec
    labels:
      topic: "$1"
    type: GAUGE

  - pattern: 'kafka.server<type=\"broker-topic-metrics\", name=\"MessagesInPerSec\"><>OneMinuteRate'
    name: kafka_server_broker_topic_metrics_messages_in_per_sec_total
    type: GAUGE

  - pattern: 'kafka.server<type=\"broker-topic-metrics\", name=\"BytesInPerSec\"><>OneMinuteRate'
    name: kafka_server_broker_topic_metrics_bytes_in_per_sec_total
    type: GAUGE

  - pattern: 'kafka.server<type=\"broker-topic-metrics\", name=\"BytesOutPerSec\"><>OneMinuteRate'
    name: kafka_server_broker_topic_metrics_bytes_out_per_sec_total
    type: GAUGE

  # ==========================================
  # Network Metrics (total bytes in/out)
  # ==========================================
  - pattern: 'kafka.network<type=\"server-metrics\", name=\"BytesPerSec\"><>OneMinuteRate'
    name: kafka_network_server_metrics_bytes_per_sec
    type: GAUGE

  - pattern: 'kafka.network<type=\"server-metrics\", name=\"RequestsPerSec\"><>OneMinuteRate'
    name: kafka_network_server_metrics_requests_per_sec
    type: GAUGE

  - pattern: 'kafka.network<type=\"server-metrics\", name=\"RequestMetrics\"><>Count'
    name: kafka_network_server_metrics_request_count
    type: GAUGE

  # ==========================================
  # Request Latency Metrics (Produce, FetchConsumer, FetchLeader)
  # ==========================================
  - pattern: 'kafka.network<type=\"request-metrics\", name=\"TotalTimeMs\", request=\"Produce\"><>Mean'
    name: kafka_network_request_metrics_total_time_ms_avg
    labels:
      request: "Produce"
    type: GAUGE

  - pattern: 'kafka.network<type=\"request-metrics\", name=\"TotalTimeMs\", request=\"FetchConsumer\"><>Mean'
    name: kafka_network_request_metrics_total_time_ms_avg
    labels:
      request: "FetchConsumer"
    type: GAUGE

  - pattern: 'kafka.network<type=\"request-metrics\", name=\"TotalTimeMs\", request=\"FetchLeader\"><>Mean'
    name: kafka_network_request_metrics_total_time_ms_avg
    labels:
      request: "FetchLeader"
    type: GAUGE

  # ==========================================
  # Replica Manager Metrics (partition leadership, under-replicated)
  # ==========================================
  - pattern: 'kafka.server<type=\"replica-manager\", name=\"UnderReplicatedPartitions\"><>Value'
    name: kafka_server_replica_manager_under_replicated_partitions
    type: GAUGE

  - pattern: 'kafka.server<type=\"replica-manager\", name=\"IsrShrinksPerSec\"><>OneMinuteRate'
    name: kafka_server_replica_manager_isr_shrinks_per_sec
    type: GAUGE

  - pattern: 'kafka.server<type=\"replica-manager\", name=\"IsrExpandsPerSec\"><>OneMinuteRate'
    name: kafka_server_replica_manager_isr_expands_per_sec
    type: GAUGE

  - pattern: 'kafka.server<type=\"replica-manager\", name=\"PartitionCount\"><>Value'
    name: kafka_server_replica_manager_partition_count
    type: GAUGE

  - pattern: 'kafka.server<type=\"replica-manager\", name=\"LeaderCount\"><>Value'
    name: kafka_server_replica_manager_leader_count
    type: GAUGE

  - pattern: 'kafka.server<type=\"replica-manager\", name=\"OfflinePartitionsCount\"><>Value'
    name: kafka_server_replica_manager_offline_partitions_count
    type: GAUGE

  # ==========================================
  # Log Manager Metrics
  # ==========================================
  - pattern: 'kafka.server<type=\"broker-log-manager\", name=\"LogDirectoryMetrics\"><>Value'
    name: kafka_server_broker_log_manager_log_directory_metrics
    type: GAUGE

  # ==========================================
  # JMX Exporter internal metrics
  # ==========================================
  - pattern: 'io.prometheus.jmx<type=\"JMXExporterMetrics\"><>(value|scrape_duration_seconds)'
    name: kafka_jmx_exporter_$1
    type: GAUGE

  # ==========================================
  # Catch-all for any other JMX metrics not explicitly handled
  # ==========================================
  - pattern: 'kafka.<type=\"(.*)\", name=\"(.*)\"><>(Value|count|oneMinuteRate|fiveMinuteRate|meanRate)'
    name: kafka_$1_$2
    type: GAUGE
