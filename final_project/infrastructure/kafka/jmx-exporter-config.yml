# JMX Exporter configuration for Prometheus
# Extracts Kafka metrics in Prometheus-compatible format

lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  # General patterns
  - pattern: 'kafka.<type="request-handler-metrics", name="RequestHandlerAvgIdlePercent", kafka.bootstrap.servers="(.*)"><>Value'
    name: kafka_server_request_handler_avg_idle_percent
    labels:
      bootstrap_servers: "$1"
    type: GAUGE

  # Broker metrics
  - pattern: 'kafka.server<type="KafkaRequestHandlerPool", name="RequestHandlerAvgIdlePercent"><>Value'
    name: kafka_server_kafkarequesthandlerpool_request_handler_avg_idle_percent
    type: GAUGE

  - pattern: 'kafka.server<type="request-handler-metrics", name="RequestHandlerAvgIdlePercent"><>Value'
    name: kafka_server_request_handler_avg_idle_percent
    type: GAUGE

  # Topic metrics
  - pattern: 'kafka.server<type="replica-manager", name="(.*)"><>Value'
    name: kafka_server_replica_manager_$1
    type: GAUGE

  # Broker log metrics
  - pattern: 'kafka.server<type="broker-log-manager", name="(.*)"><>Value'
    name: kafka_server_broker_log_manager_$1
    type: GAUGE

  # JMX metrics (catch-all for unhandled metrics)
  - pattern: 'kafka.<type="(.*)", name="(.*)"><>(Value|count|oneMinuteRate|fiveMinuteRate|fiveMinutedRate|meanRate)'
    name: kafka_$1_$2
    type: GAUGE
