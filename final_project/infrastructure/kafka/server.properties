# Base Kafka server.properties for KRaft mode with SASL/PLAIN
# This is the base configuration; docker-compose overrides specific values per broker

############################# Server Basics #############################

# The role of this broker
# Override via KAFKA_PROCESS_ROLES per container: broker,controller

############################# Cluster #############################

# Global cluster ID (set via environment variable)
# cluster.id=${CLUSTER_ID}

############################# Socket Server #############################

# Security protocol configuration
security.protocol=SASL_PLAINTEXT
security.inter.broker.protocol=SASL_PLAINTEXT

# SASL mechanism
sasl.mechanism.inter.broker.protocol=PLAIN

# SASL JAAS configuration (set via environment variable)
# sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";

############################# Log Basics #############################

# Log directory (override per broker via KAFKA_LOG_DIRS)
# log.dirs=/var/lib/kafka/data

# Default number of partitions per topic
num.partitions=6

############################# Log Flush #############################

# How often to flush underlying _log manager to disk
log.flush.interval.messages=10000
log.flush.interval.ms=1000
