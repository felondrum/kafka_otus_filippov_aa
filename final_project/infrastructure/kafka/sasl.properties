# SASL/PLAIN authentication configuration for Kafka brokers
# This file is mounted into each Kafka broker container

# Default superuser for local development
security.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"admin\" password=\"admin-secret\";

# User credentials (format: principal_name:password[,role])
# These will be set via environment variables in docker-compose.yml
KAFKA_CLIENTS_USERNAME=admin
KAFKA_CLIENTS_PASSWORD=admin-secret
KAFKA_CLIENTS_ROLE=
KAFKA_CONTROLS_USERNAME=controls
KAFKA_CONTROLS_PASSWORD=controls-secret
KAFKA_CONTROLS_ROLE=
