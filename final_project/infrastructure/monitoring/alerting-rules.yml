groups:
  - name: kafka-connect-alerts
    rules:
      - alert: KafkaConnectDLQEvents
        expr: kafka_connect_task_error_metrics_connector_kafka_connect_jdbc_sink_total_record_errors:_0_0 > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Kafka Connect DLQ receiving events"
          description: "The Kafka Connect JDBC Sink connector has encountered {{ $value }} record errors. Check connector logs and DLQ topic: transcription.enriched.dlq"

      - alert: KafkaConnectConnectorFailed
        expr: kafka_connect_connect_worker_metrics_connector_failed_task_count:_0 > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka Connect JDBC Sink connector has failed tasks"
          description: "The kafka-connect-jdbc-sink connector has {{ $value }} failed tasks. Immediate investigation required."

      - alert: KafkaConnectConnectorPaused
        expr: kafka_connect_connect_worker_metrics_connector_paused_task_count:_0 > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka Connect JDBC Sink connector has paused tasks"
          description: "The kafka-connect-jdbc-sink connector has {{ $value }} paused tasks for more than 5 minutes."

      - alert: KafkaConnectTaskFailed
        expr: kafka_connect_connect_worker_metrics_connector_failed_task_count:_0 > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka Connect JDBC Sink task is FAILED"
          description: "A task of the kafka-connect-jdbc-sink connector has failed. Check connector tasks status."
