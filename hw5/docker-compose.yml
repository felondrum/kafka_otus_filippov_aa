version: '3.8'

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka-new-hw5
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTIONAL_ID_EXPERIMENTAL_ENABLE: "true"
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
    ports:
      - "9093:9093"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks:
      - kafka-network

  postgres:
    image: postgres:16
    container_name: postgres-hw5
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: otus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-hw5:/var/lib/postgresql/data
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d otus"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-connect:
    image: debezium/connect:2.5
    container_name: kafka-connect-hw5
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      REST_PORT: 8083
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      PLUGIN_PATH: /usr/share/java,/usr/share/plugins,/opt/kafka/plugins
      LOG_LEVEL: INFO
    ports:
      - "8083:8083"
    volumes:
      - ./connect-config.json:/tmp/connect-config.json:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: kafdrop-hw5
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXT_PATH: "/"
    networks:
      - kafka-network

volumes:
  postgres-data-hw5:

networks:
  kafka-network:
    driver: bridge
